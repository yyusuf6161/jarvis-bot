name: Jarvis Paper Trading

on:
  schedule:
    - cron: "5 * * * *"      # jede Stunde, 5 Minuten nach jeder fertigen 1h-Kerze
  workflow_dispatch:          # Knopf "Run workflow" zum Testen

permissions:
  contents: write             # damit Jarvis sein Tagebuch speichern darf

concurrency:
  group: jarvis-daten
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jarvis prueft 10 Coins
        run: python jarvis_paper.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Tagebuch speichern
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add paper
          git diff --cached --quiet || (git commit -m "Paper Trading Update" && git pull --rebase && git push)
